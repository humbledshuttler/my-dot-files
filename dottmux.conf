# ==========================================
# 1. GLOBAL SETTINGS & OPTIMIZATIONS
# ==========================================
set-option -g base-index 1 
set-option -g pane-base-index 1 
set-option -g status on 
set-option -g status-justify "left" 
set-option -g status-left-length 60 
set-option -g status-right-length 90 
set-option -g mouse off 
set-option -g default-shell /bin/zsh 

# ELIMINATE RENDERING DELAYS (Crucial for Ghostty/Wayland)
set -s escape-time 10
set -g repeat-time 0
set-option -g status-interval 5

# Set modern terminal capabilities for true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ',xterm*:Cr=\E]12;gray\007' 
set -as terminal-overrides ',xterm*:Tc'

# ==========================================
# 2. KEYBINDINGS
# ==========================================
# Remap prefix from 'C-b' to '`'
unbind C-b
set-option -g prefix ` 
bind-key ` send-prefix 

# Split panes using / and - 
bind / split-window -h 
bind - split-window -v 
unbind '"' 
unbind % 

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Switch panes using Alt-arrow without prefix 
bind -n M-Left select-pane -L 
bind -n M-Right select-pane -R 
bind -n M-Up select-pane -U 
bind -n M-Down select-pane -D 

# Shift arrow to switch windows 
bind -n S-Left previous-window 
bind -n S-Right next-window 

# ==========================================
# 3. PLUGINS
# ==========================================
set -g @resurrect-strategy-vim 'session'

# tmux-continuum: auto-save the environment on a timer so a crash/reboot
# without a manual save doesn't lose all open windows.
set -g @continuum-save-interval '15'   # minutes between automatic saves
set -g @continuum-restore 'on'         # auto-restore last save when tmux server starts

# resurrect must load before continuum
run-shell ~/.tmux-plugins/tmux-resurrect/resurrect.tmux
run-shell ~/.tmux-plugins/tmux-continuum/continuum.tmux

# ==========================================
# 4. COLOR THEME & INTERFACE STYLING
# ==========================================
set -g status-bg blue 
set -g status-fg white 
set-option -g status-style bg=colour237,fg=colour223 
set-window-option -g window-status-style bg=colour214,fg=colour237 
set-window-option -g window-status-activity-style bg=colour237,fg=colour248 
set-window-option -g window-status-current-style bg=red,fg=colour237 
set-option -g pane-active-border-style fg=blue,bright 
set-option -g pane-border-style fg=colour239 
set-option -g message-style bg=colour239,fg=colour223 
set-option -g message-command-style bg=colour239,fg=colour223 
set-option -g display-panes-active-colour colour1 
set-option -g display-panes-colour colour237 
set-window-option -g clock-mode-colour colour109 
set-window-option -g window-status-bell-style bg=colour167,fg=colour235 

# ==========================================
# 5. STATUSBAR 
# ==========================================
# Clean up left session indicator
set-option -g status-left "\ #[fg=colour7,bg=colour241]#{?client_prefix,#[bg=colour167],} ❐ #S #[fg=colour241,bg=colour237]#{?client_prefix,#[fg=colour167],}#{?window_zoomed_flag, 🔍 ,}"

# Active Window Format (Only 1 clean block transition)
set-window-option -g window-status-current-format "#[fg=colour237,bg=colour214]#[fg=colour239,bg=colour214] #I* #[fg=colour239,bg=colour214,bold] #W #[fg=colour214,bg=colour237]" 

# Inactive Window Format (Flattens structural double blocks)
set-window-option -g window-status-format "#[fg=colour237,bg=colour239,noitalics]#[fg=colour223,bg=colour239] #I #[fg=colour223,bg=colour239] #W #[fg=colour239,bg=colour237]" 

# Right Side (Clean single chevron transition for date/time)
set-option -g status-right "#[fg=colour214,bg=colour237]#[fg=colour237,bg=colour214] %b %d %y #[fg=colour109,bg=colour214]#[fg=colour237,bg=colour109] %H:%M "

# ==========================================
# 6. HISTORY LIMIT DECREASE
# ==========================================
# 50,000,000 lines requires massive RAM buffering on pane switches. Reduced to a still-huge 100,000.
setw -g history-limit 10000
